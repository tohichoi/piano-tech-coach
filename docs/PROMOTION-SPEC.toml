# PROMOTION-SPEC.toml
# Piano Tech Coach - ATD 포트폴리오 연동 단일 규격 (SSOT)
#
# 편입 프레임: Adopted Project
#   디렉터(Mike)가 단독 개발한 기존 프로젝트를 ATD 허브에 편입하여
#   분석 / 문서화 / 플랫폼 이관 검증 / 감사·검증을 수행하고,
#   이어 승인 범위에서 소스를 수정한 사례.
#   ATD 는 최초 구현(2026-06-23)에는 참여하지 않았다.
#   participating_agents 에는 편입 이후 실제로 수행한 기여만 기재한다.
#
# development_origin = "mike+atd" (2026-09-23 확정, 미결 아님)
#   편입 시점에는 소스 무수정이었으나, 편입 후 거버넌스(Mike)가 소스 수정을 승인했고
#   ATD 가 실제로 소스를 변경했다. 편입 프레임의 판단 기준은 참여 서술이 아니라
#   실제 소스 변경 여부다 (core/AGENTS.md §5-1). 변경된 소스:
#     - 인앱 외장 VST 안내 문구의 Windows 전용 표현을 OS 중립으로 정정
#       (src/components/InstrumentSelector.tsx, src/components/MidiConnector.tsx)
#     - Web MIDI 전송 타임스탬프와 Tone/AudioContext 시간축을 분리하는 격리 헬퍼 도입
#       (src/utils/audioSynth.ts). 메트로놈 정지→재시작 시 Transport 틱 역행 에러는
#       이 수정으로 해소되지 않았고, 시간축 격리 개선으로만 반영됐다 (PROJECT-DESCRIPTION.md §4.4 N3).
#     - (완료·검증) 감사 지적 소스 결함 2건: 편차 차트 범례 ±180ms 정정, A11y 폼 라벨 6건
#       (src/components/DeviationChart.tsx, Metronome.tsx, SheetMusicViewer.tsx, SimulatorPanel.tsx 외).
#       Noah 재검증 PASS (2026-09-23).
#   이 값은 case_study_badge = "ATD Adopted Project" 를 반드시 동반해야 하며,
#   배지 없이 "mike+atd" 를 쓰면 publisher 가 예외를 던져 빌드를 중단한다 (core/AGENTS.md §5-1).
#   선례(로컬 워크스페이스에서 직접 확인): 두 프로젝트 모두 category="AI & Automation" +
#   case_study_badge="ATD Adopted Project" + development_origin="mike+atd" 조합을 쓴다.
#     - sheet-music-extractor          : 저장소 docs/PROMOTION-SPEC.toml:15-19
#     - generate-roland-hp603-instruments: 저장소 docs/PROMOTION-SPEC.toml:19-23
#   주의: 허브 docs/projects/*.toml 은 git 원격 등록부일 뿐 development_origin/case_study_badge
#   필드를 갖지 않으므로, 선례 확인은 각 프로젝트 저장소의 PROMOTION-SPEC.toml 에서 해야 한다.
#
# category = "AI & Automation" (거버넌스 승인 확정)
#   음악/MIDI 도메인 선례(위 두 프로젝트)와 동일 분류를 따른다. 템플릿이 허용하는 분류는
#   "Vision AI & IoT | Quantitative Trading | System Architecture | AI & Automation" 4종이다.

